<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <title>Register</title>
</head>

<body>
    <div class="container">
        <div class="formModalContainer">
            <div class="icon">
                <i data-lucide="user-plus"></i>
            </div>
            <div class="texts">
                <div class="heading">
                    <h2>Welcome!</h2>
                </div>
                <div class="subHeading">
                    <p>Create your 01Social account</p>
                </div>
            </div>
            <div class="formContainer">
                <form>
                    <div class="inputContainer">
                        <label for="firstname">First Name</label>
                        <input type="text" name="firstname" placeholder="first name">
                    </div>
                    <div class="inputContainer">
                        <label for="lastname">Last Name</label>
                        <input type="text" name="lastname" placeholder="last name">
                    </div>
                    <div class="inputContainer">
                        <label for="username">Username</label>
                        <input type="text" name="username" placeholder="username">
                    </div>
                    <div class="inputContainer">
                        <label for="gender">Gender</label>
                        <select name="gender" id="gender">
                            <option value="male">Male</option>
                            <option value="female">Female</option>
                        </select>
                    </div>
                    <div class="inputContainerLarge">
                        <label for="email">Email</label>
                        <input type="email" name="email" placeholder="email">
                    </div>
                    <div class="inputContainer">
                        <label for="password">Password</label>
                        <input type="password" name="password" placeholder="password">
                    </div>
                    <div class="inputContainer">
                        <label for="password-confirm">Confirm Password</label>
                        <input type="password" name="password-confirm" placeholder="confirm password">
                    </div>
                    <div class="inputContainer">
                        <label for="nickname">Nickname(Optional)</label>
                        <input type="text" name="nickname" placeholder="nickname">
                    </div>
                    <div class="inputContainer">
                        <label for="age">Age</label>
                        <input type="number" name="age" placeholder="age">
                    </div>
                    <div class="inputContainerLarge">
                        <label for="about">About me (Optional)</label>
                        <textarea name="about" id="about" placeholder="about me"></textarea>
                    </div>
                    <div class="inputContainerLarge">
                        <button>Choose Avatar (Optional)</button>
                    </div>
                    <div class="buttons">
                        <input class="secondAction" type="button" value="Login">
                        <input class="mainAction" type="submit" value="Register">
                    </div>
                </form>
            </div>
        </div>
    </div>
    <script>
        lucide.createIcons();
    </script>
</body>

</html>
